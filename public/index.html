<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NestJS Taskboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>NestJS Taskboard</h1>
    <p class="tagline">Canonical NestJS fixture &mdash; TypeORM + SQLite persistence</p>
  </header>

  <main>
    <section class="board" aria-label="Taskboard">
      <div class="projects-panel">
        <h2>Projects</h2>
        <div class="toolbar">
          <input id="project-search" type="search" placeholder="Find projects…" aria-label="Search projects" />
          <button id="new-project-btn" type="button">+ New project</button>
        </div>
        <form id="project-form" class="card-form" hidden>
          <input id="project-name" name="name" type="text" maxlength="120" placeholder="Project name" required />
          <input id="project-description" name="description" type="text" maxlength="1000" placeholder="Description (optional)" />
          <div class="inline-actions">
            <button type="submit">Create</button>
            <button type="button" data-cancel="projectForm">Cancel</button>
          </div>
          <p id="project-error" class="error" role="alert"></p>
        </form>
        <ul id="project-list" class="project-list"></ul>
      </div>

      <div class="tasks-panel">
        <h2 id="panel-title">Tasks</h2>
        <div class="toolbar">
          <input id="task-search" type="search" placeholder="Search tasks…" aria-label="Search tasks" />
          <select id="task-status-filter" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="todo">Todo</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select>
          <select id="task-priority-filter" aria-label="Filter by priority">
            <option value="">All priorities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
          <button id="new-task-btn" type="button" disabled>+ New task</button>
        </div>
        <form id="task-form" class="card-form" hidden>
          <input id="task-title" name="title" type="text" maxlength="255" placeholder="Task title" required />
          <input id="task-description" name="description" type="text" maxlength="2000" placeholder="Description (optional)" />
          <div class="inline-actions">
            <button type="submit">Create</button>
            <button type="button" data-cancel="taskForm">Cancel</button>
          </div>
          <p id="task-error" class="error" role="alert"></p>
        </form>
        <ul id="task-list" class="task-list"></ul>
      </div>
    </section>
  </main>

  <footer>
    <span>release <code id="release-marker">…</code></span>
    <span id="runtime-marker"></span>
  </footer>

  <dialog id="edit-dialog">
    <form method="dialog" class="card-form" id="edit-form">
      <h3 id="edit-title">Edit</h3>
      <input id="edit-name" name="name" type="text" maxlength="120" placeholder="Name / title" required />
      <input id="edit-description" name="description" type="text" maxlength="1000" placeholder="Description (optional)" />
      <label>Status
        <select id="edit-status">
          <option value="todo">Todo</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
          <option value="active">Active</option>
          <option value="archived">Archived</option>
        </select>
      </label>
      <label>Priority
        <select id="edit-priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>
      <div class="inline-actions">
        <button type="submit">Save</button>
        <button type="button" value="cancel" id="edit-cancel">Cancel</button>
      </div>
      <p id="edit-error" class="error" role="alert"></p>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
